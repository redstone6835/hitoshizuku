[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[features]
bench = []
block-bench = ["general/block-profile"]
allocator-bench = []
kcsan = ["dep:kcsan"]
embedded-initramfs = []
trace-task-lifecycle = ["general/trace-task-lifecycle", "sched/trace-task-lifecycle"]
trace-signal-wait = []
trace-syscall = ["general/trace-syscall"]
performance-profile = [
    "dep:profiling",
    "allocator/performance-profile",
    "arch/performance-profile",
    "general/performance-profile",
    "net/performance-profile",
    "sched/performance-profile",
    "vfs/performance-profile",
]
syscall-model-markers = [
    "performance-profile",
    "arch/syscall-model-markers",
    "profiling/syscall-model-markers",
    "sched/syscall-model-markers",
]
allocator-tests = [
    "ktest/kernel",
    "allocator/ktest-kernel",
]
kernel-tests = [
    "ktest/kernel",
    "general/kernel-tests",
    "errno/ktest-kernel",
    "elf/ktest-kernel",
    "mm/ktest-kernel",
    "log/ktest-kernel",
    "allocator/ktest-kernel",
    "soyo/test-support",
]
soyo-tests = [
    "ktest/kernel",
    "soyo/test-support",
]
smp-tests = ["ktest/kernel"]
lazy-sxe-tests = []
network-tests = ["ktest/kernel"]

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
doctest = false
bench = false

[dependencies]
acpi = { workspace = true }
aml = { workspace = true }
arch = { path = "../arch" }
elf = { path = "../libs/elf" }
elm_model = { package = "elm", path = "../libs/elm", default-features = false, features = ["runtime-model"] }
elm-loader = { path = "../libs/elm-loader" }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["alloc", "zeroize"] }
efi = { path = "../libs/efi" }
errno = { path = "../libs/errno" }
extfs = { path = "../libs/extfs" }
fatfs = { path = "../libs/fatfs" }
general = { path = "../general" }
elm-language-abi = { path = "../libs/elm-language-abi", default-features = false }
ktest = { path = "../libs/ktest" }
kcsan = { path = "../libs/kcsan", optional = true }
kernel-symbols = { path = "../libs/kernel-symbols", default-features = false }
log = { path = "../libs/log" }
allocator ={ path = "../libs/allocator" }
hal = { path = "../hal" }
mm = { path = "../libs/mm" }
native-abi = { path = "../libs/native-abi" }
net = { path = "../libs/net" }
ns = { path = "../libs/ns", default-features = false }
profiling = { path = "../libs/profiling", optional = true }
sched = { path = "../libs/sched" }
sha2 = { version = "0.10.9", default-features = false }
socket = { path = "../libs/socket" }
spin = { version = "0.9", default-features = false, features = ["spin_mutex"] }
soyo = { path = "../libs/soyo" }
vfs = { path = "../libs/vfs" }

# The freestanding x86 image is compiled without a host SIMD target.  Keep
# the hosted/default graph free to use SHA-NI, while selecting sha2's portable
# constant-time backend for the bare-metal target.
[target.'cfg(target_os = "none")'.dependencies]
sha2 = { version = "0.10.9", default-features = false, features = ["force-soft"] }

[build-dependencies]
ed25519-dalek = { version = "2.2.0", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
xtask = { path = "../xtask", default-features = false }
