[workspace]

[package]
name = "soyo-linker"
version = "0.1.0"
edition = "2024"

[lib]
name = "soyo_linker"
path = "src/lib.rs"

[[bin]]
name = "soyo-ld"
path = "src/bin/soyo-ld.rs"

[[bin]]
name = "soyo-verify"
path = "src/bin/soyo-verify.rs"

[[bin]]
name = "soyo-inspect"
path = "src/bin/soyo-inspect.rs"

[dependencies]
ed25519-dalek = { version = "=2.2.0", features = ["zeroize"] }
native-abi = { path = "../../libs/native-abi" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
soyo = { path = "../../libs/soyo" }
