[package]
name = "sched"
version = "0.1.0"
edition = "2024"

[lib]
test = true
doctest = false
bench = false

[features]
trace-task-lifecycle = []
performance-profile = ["dep:profiling"]

[dependencies]
errno = { path = "../errno" }
log = { path = "../log" }
profiling = { path = "../profiling", optional = true }

[dev-dependencies]
ktest = { path = "../ktest" }
