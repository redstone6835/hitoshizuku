[package]
name = "acpi"
version = "6.1.1"
authors = ["Isaac Woods"]
repository = "https://github.com/rust-osdev/acpi"
description = "A pure-Rust library for interacting with ACPI"
categories = ["hardware-support", "no-std"]
license = "MIT/Apache-2.0"
edition = "2024"

[lib]
test = false
doctest = false
bench = false

[dependencies]
bit_field = "0.10.2"
bitflags = "2.5.0"
byteorder = { version = "1.5.0", default-features = false }
log = { path = "../log" }
kernel-symbols = { path = "../kernel-symbols" }
pci_types = "0.10.0"
spinning_top = "0.3.0"

[features]
default = ["alloc", "aml"]
alloc = []
aml = ["alloc"]
