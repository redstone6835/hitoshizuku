[build]
rustflags = [
    "--cfg=elm_kernel_api=\"contest-2026\"",
    "--check-cfg=cfg(elm_kernel_api,values(\"contest-2026\"))",
    "--cfg=elm_kernel_profile=\"b7286352a56996db2e79f4fc7bba7b35a2936cfa3150a7df74cac8ae540a49a2\"",
    "--check-cfg=cfg(elm_kernel_profile,values(\"b7286352a56996db2e79f4fc7bba7b35a2936cfa3150a7df74cac8ae540a49a2\"))",
]

[target.riscv64gc-unknown-none-elf]
linker = "rust-lld"
rustflags = [
    "-C",
    "link-arg=-Telm.ld",
    "-C",
    "relocation-model=pic",
    "-C",
    "code-model=small",
    "-C",
    "link-arg=-pie",
    "-C",
    "link-arg=-z",
    "-C",
    "link-arg=notext",
    "-C",
    "link-arg=--gc-sections",
    "-C",
    "link-arg=--build-id=none",
    "--cfg=elm_kernel_api=\"contest-2026\"",
    "--check-cfg=cfg(elm_kernel_api,values(\"contest-2026\"))",
    "--cfg=elm_kernel_profile=\"b7286352a56996db2e79f4fc7bba7b35a2936cfa3150a7df74cac8ae540a49a2\"",
    "--check-cfg=cfg(elm_kernel_profile,values(\"b7286352a56996db2e79f4fc7bba7b35a2936cfa3150a7df74cac8ae540a49a2\"))",
]

[target.loongarch64-unknown-none]
linker = "rust-lld"
rustflags = [
    "-C",
    "link-arg=-Telm.ld",
    "-C",
    "relocation-model=pic",
    "-C",
    "code-model=small",
    "-C",
    "link-arg=-pie",
    "-C",
    "link-arg=-z",
    "-C",
    "link-arg=notext",
    "-C",
    "link-arg=--gc-sections",
    "-C",
    "link-arg=--build-id=none",
    "-A",
    "named_asm_labels",
    "--cfg=elm_kernel_api=\"contest-2026\"",
    "--check-cfg=cfg(elm_kernel_api,values(\"contest-2026\"))",
    "--cfg=elm_kernel_profile=\"b7286352a56996db2e79f4fc7bba7b35a2936cfa3150a7df74cac8ae540a49a2\"",
    "--check-cfg=cfg(elm_kernel_profile,values(\"b7286352a56996db2e79f4fc7bba7b35a2936cfa3150a7df74cac8ae540a49a2\"))",
]
