[build]
rustflags = [
    "--cfg=elm_kernel_api=\"contest-2026\"",
    "--check-cfg=cfg(elm_kernel_api,values(\"contest-2026\"))",
    "--cfg=elm_kernel_profile=\"d324fcdf1778f2be3b34307920e94c9b9a7cc3d4c882d0c90c5e36522d57b9b6\"",
    "--check-cfg=cfg(elm_kernel_profile,values(\"d324fcdf1778f2be3b34307920e94c9b9a7cc3d4c882d0c90c5e36522d57b9b6\"))",
]

[target.riscv64gc-unknown-none-elf]
linker = "rust-lld"
rustflags = [
    "-C",
    "link-arg=-Telm.ld",
    "-C",
    "relocation-model=pic",
    "-C",
    "code-model=small",
    "-C",
    "link-arg=-pie",
    "-C",
    "link-arg=-z",
    "-C",
    "link-arg=notext",
    "-C",
    "link-arg=--gc-sections",
    "-C",
    "link-arg=--build-id=none",
    "--cfg=elm_kernel_api=\"contest-2026\"",
    "--check-cfg=cfg(elm_kernel_api,values(\"contest-2026\"))",
    "--cfg=elm_kernel_profile=\"d324fcdf1778f2be3b34307920e94c9b9a7cc3d4c882d0c90c5e36522d57b9b6\"",
    "--check-cfg=cfg(elm_kernel_profile,values(\"d324fcdf1778f2be3b34307920e94c9b9a7cc3d4c882d0c90c5e36522d57b9b6\"))",
]

[target.loongarch64-unknown-none]
linker = "rust-lld"
rustflags = [
    "-C",
    "link-arg=-Telm.ld",
    "-C",
    "relocation-model=pic",
    "-C",
    "code-model=small",
    "-C",
    "link-arg=-pie",
    "-C",
    "link-arg=-z",
    "-C",
    "link-arg=notext",
    "-C",
    "link-arg=--gc-sections",
    "-C",
    "link-arg=--build-id=none",
    "-A",
    "named_asm_labels",
    "--cfg=elm_kernel_api=\"contest-2026\"",
    "--check-cfg=cfg(elm_kernel_api,values(\"contest-2026\"))",
    "--cfg=elm_kernel_profile=\"d324fcdf1778f2be3b34307920e94c9b9a7cc3d4c882d0c90c5e36522d57b9b6\"",
    "--check-cfg=cfg(elm_kernel_profile,values(\"d324fcdf1778f2be3b34307920e94c9b9a7cc3d4c882d0c90c5e36522d57b9b6\"))",
]
