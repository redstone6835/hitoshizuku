[build]
rustflags = [
    "--cfg=elm_kernel_api=\"contest-2026\"",
    "--check-cfg=cfg(elm_kernel_api,values(\"contest-2026\"))",
    "--cfg=elm_kernel_profile=\"0f37502d17839ca7fd5d4e5e5e9ee23babec6e21a02807563f1e301d30315b07\"",
    "--check-cfg=cfg(elm_kernel_profile,values(\"0f37502d17839ca7fd5d4e5e5e9ee23babec6e21a02807563f1e301d30315b07\"))",
]

[target.riscv64gc-unknown-none-elf]
linker = "rust-lld"
rustflags = [
    "-C",
    "link-arg=-Telm.ld",
    "-C",
    "relocation-model=pic",
    "-C",
    "code-model=small",
    "-C",
    "link-arg=-pie",
    "-C",
    "link-arg=-z",
    "-C",
    "link-arg=notext",
    "-C",
    "link-arg=--gc-sections",
    "-C",
    "link-arg=--build-id=none",
    "--cfg=elm_kernel_api=\"contest-2026\"",
    "--check-cfg=cfg(elm_kernel_api,values(\"contest-2026\"))",
    "--cfg=elm_kernel_profile=\"0f37502d17839ca7fd5d4e5e5e9ee23babec6e21a02807563f1e301d30315b07\"",
    "--check-cfg=cfg(elm_kernel_profile,values(\"0f37502d17839ca7fd5d4e5e5e9ee23babec6e21a02807563f1e301d30315b07\"))",
]

[target.loongarch64-unknown-none]
linker = "rust-lld"
rustflags = [
    "-C",
    "link-arg=-Telm.ld",
    "-C",
    "relocation-model=pic",
    "-C",
    "code-model=small",
    "-C",
    "link-arg=-pie",
    "-C",
    "link-arg=-z",
    "-C",
    "link-arg=notext",
    "-C",
    "link-arg=--gc-sections",
    "-C",
    "link-arg=--build-id=none",
    "-A",
    "named_asm_labels",
    "--cfg=elm_kernel_api=\"contest-2026\"",
    "--check-cfg=cfg(elm_kernel_api,values(\"contest-2026\"))",
    "--cfg=elm_kernel_profile=\"0f37502d17839ca7fd5d4e5e5e9ee23babec6e21a02807563f1e301d30315b07\"",
    "--check-cfg=cfg(elm_kernel_profile,values(\"0f37502d17839ca7fd5d4e5e5e9ee23babec6e21a02807563f1e301d30315b07\"))",
]
