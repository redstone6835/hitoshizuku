[build]
rustflags = [
    "--cfg=elm_kernel_api=\"contest-2026\"",
    "--check-cfg=cfg(elm_kernel_api,values(\"contest-2026\"))",
    "--cfg=elm_kernel_profile=\"5c588613183659aa1c1451f7c56c066d7381635ae883b5a65faf5648d062d7c4\"",
    "--check-cfg=cfg(elm_kernel_profile,values(\"5c588613183659aa1c1451f7c56c066d7381635ae883b5a65faf5648d062d7c4\"))",
]

[target.riscv64gc-unknown-none-elf]
linker = "rust-lld"
rustflags = [
    "-C",
    "link-arg=-Telm.ld",
    "-C",
    "relocation-model=pic",
    "-C",
    "code-model=small",
    "-C",
    "link-arg=-pie",
    "-C",
    "link-arg=-z",
    "-C",
    "link-arg=notext",
    "-C",
    "link-arg=--gc-sections",
    "-C",
    "link-arg=--build-id=none",
    "--cfg=elm_kernel_api=\"contest-2026\"",
    "--check-cfg=cfg(elm_kernel_api,values(\"contest-2026\"))",
    "--cfg=elm_kernel_profile=\"5c588613183659aa1c1451f7c56c066d7381635ae883b5a65faf5648d062d7c4\"",
    "--check-cfg=cfg(elm_kernel_profile,values(\"5c588613183659aa1c1451f7c56c066d7381635ae883b5a65faf5648d062d7c4\"))",
]

[target.loongarch64-unknown-none]
linker = "rust-lld"
rustflags = [
    "-C",
    "link-arg=-Telm.ld",
    "-C",
    "relocation-model=pic",
    "-C",
    "code-model=small",
    "-C",
    "link-arg=-pie",
    "-C",
    "link-arg=-z",
    "-C",
    "link-arg=notext",
    "-C",
    "link-arg=--gc-sections",
    "-C",
    "link-arg=--build-id=none",
    "-A",
    "named_asm_labels",
    "--cfg=elm_kernel_api=\"contest-2026\"",
    "--check-cfg=cfg(elm_kernel_api,values(\"contest-2026\"))",
    "--cfg=elm_kernel_profile=\"5c588613183659aa1c1451f7c56c066d7381635ae883b5a65faf5648d062d7c4\"",
    "--check-cfg=cfg(elm_kernel_profile,values(\"5c588613183659aa1c1451f7c56c066d7381635ae883b5a65faf5648d062d7c4\"))",
]
