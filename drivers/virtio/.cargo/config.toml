[build]
rustflags = [
    "--cfg=elm_kernel_api=\"contest-2026\"",
    "--check-cfg=cfg(elm_kernel_api,values(\"contest-2026\"))",
    "--cfg=elm_kernel_profile=\"fa3e568943ffe4372ea703e908e50f7611d2e55b1567b1db844abe04ebc80431\"",
    "--check-cfg=cfg(elm_kernel_profile,values(\"fa3e568943ffe4372ea703e908e50f7611d2e55b1567b1db844abe04ebc80431\"))",
]

[target.riscv64gc-unknown-none-elf]
linker = "rust-lld"
rustflags = [
    "-C",
    "link-arg=-Telm.ld",
    "-C",
    "relocation-model=pic",
    "-C",
    "code-model=small",
    "-C",
    "link-arg=-pie",
    "-C",
    "link-arg=-z",
    "-C",
    "link-arg=notext",
    "-C",
    "link-arg=--gc-sections",
    "-C",
    "link-arg=--build-id=none",
    "--cfg=elm_kernel_api=\"contest-2026\"",
    "--check-cfg=cfg(elm_kernel_api,values(\"contest-2026\"))",
    "--cfg=elm_kernel_profile=\"fa3e568943ffe4372ea703e908e50f7611d2e55b1567b1db844abe04ebc80431\"",
    "--check-cfg=cfg(elm_kernel_profile,values(\"fa3e568943ffe4372ea703e908e50f7611d2e55b1567b1db844abe04ebc80431\"))",
]

[target.loongarch64-unknown-none]
linker = "rust-lld"
rustflags = [
    "-C",
    "link-arg=-Telm.ld",
    "-C",
    "relocation-model=pic",
    "-C",
    "code-model=small",
    "-C",
    "link-arg=-pie",
    "-C",
    "link-arg=-z",
    "-C",
    "link-arg=notext",
    "-C",
    "link-arg=--gc-sections",
    "-C",
    "link-arg=--build-id=none",
    "-A",
    "named_asm_labels",
    "--cfg=elm_kernel_api=\"contest-2026\"",
    "--check-cfg=cfg(elm_kernel_api,values(\"contest-2026\"))",
    "--cfg=elm_kernel_profile=\"fa3e568943ffe4372ea703e908e50f7611d2e55b1567b1db844abe04ebc80431\"",
    "--check-cfg=cfg(elm_kernel_profile,values(\"fa3e568943ffe4372ea703e908e50f7611d2e55b1567b1db844abe04ebc80431\"))",
]
