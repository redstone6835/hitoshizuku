[build]
rustflags = [
    "--cfg=elm_kernel_api=\"contest-2026\"",
    "--check-cfg=cfg(elm_kernel_api,values(\"contest-2026\"))",
    "--cfg=elm_kernel_profile=\"0556fd70a3eba0bf6c41c1bb4ca127b3b8e1d20a9eb379e3f226821ca5794af5\"",
    "--check-cfg=cfg(elm_kernel_profile,values(\"0556fd70a3eba0bf6c41c1bb4ca127b3b8e1d20a9eb379e3f226821ca5794af5\"))",
]

[target.riscv64gc-unknown-none-elf]
linker = "rust-lld"
rustflags = [
    "-C",
    "link-arg=-Telm.ld",
    "-C",
    "relocation-model=pic",
    "-C",
    "code-model=small",
    "-C",
    "link-arg=-pie",
    "-C",
    "link-arg=-z",
    "-C",
    "link-arg=notext",
    "-C",
    "link-arg=--gc-sections",
    "-C",
    "link-arg=--build-id=none",
    "--cfg=elm_kernel_api=\"contest-2026\"",
    "--check-cfg=cfg(elm_kernel_api,values(\"contest-2026\"))",
    "--cfg=elm_kernel_profile=\"0556fd70a3eba0bf6c41c1bb4ca127b3b8e1d20a9eb379e3f226821ca5794af5\"",
    "--check-cfg=cfg(elm_kernel_profile,values(\"0556fd70a3eba0bf6c41c1bb4ca127b3b8e1d20a9eb379e3f226821ca5794af5\"))",
]

[target.loongarch64-unknown-none]
linker = "rust-lld"
rustflags = [
    "-C",
    "link-arg=-Telm.ld",
    "-C",
    "relocation-model=pic",
    "-C",
    "code-model=small",
    "-C",
    "link-arg=-pie",
    "-C",
    "link-arg=-z",
    "-C",
    "link-arg=notext",
    "-C",
    "link-arg=--gc-sections",
    "-C",
    "link-arg=--build-id=none",
    "-A",
    "named_asm_labels",
    "--cfg=elm_kernel_api=\"contest-2026\"",
    "--check-cfg=cfg(elm_kernel_api,values(\"contest-2026\"))",
    "--cfg=elm_kernel_profile=\"0556fd70a3eba0bf6c41c1bb4ca127b3b8e1d20a9eb379e3f226821ca5794af5\"",
    "--check-cfg=cfg(elm_kernel_profile,values(\"0556fd70a3eba0bf6c41c1bb4ca127b3b8e1d20a9eb379e3f226821ca5794af5\"))",
]
