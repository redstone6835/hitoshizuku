[build]
rustflags = [
    "--cfg=elm_kernel_api=\"contest-2026\"",
    "--check-cfg=cfg(elm_kernel_api,values(\"contest-2026\"))",
    "--cfg=elm_kernel_profile=\"1f80174a2872ea52ae596a70b9eff094e2e9f4e90b1026c49bf9b94275a5eb7d\"",
    "--check-cfg=cfg(elm_kernel_profile,values(\"1f80174a2872ea52ae596a70b9eff094e2e9f4e90b1026c49bf9b94275a5eb7d\"))",
]

[target.riscv64gc-unknown-none-elf]
linker = "rust-lld"
rustflags = [
    "-C",
    "link-arg=-Telm.ld",
    "-C",
    "relocation-model=pic",
    "-C",
    "code-model=small",
    "-C",
    "link-arg=-pie",
    "-C",
    "link-arg=-z",
    "-C",
    "link-arg=notext",
    "-C",
    "link-arg=--gc-sections",
    "-C",
    "link-arg=--build-id=none",
    "--cfg=elm_kernel_api=\"contest-2026\"",
    "--check-cfg=cfg(elm_kernel_api,values(\"contest-2026\"))",
    "--cfg=elm_kernel_profile=\"1f80174a2872ea52ae596a70b9eff094e2e9f4e90b1026c49bf9b94275a5eb7d\"",
    "--check-cfg=cfg(elm_kernel_profile,values(\"1f80174a2872ea52ae596a70b9eff094e2e9f4e90b1026c49bf9b94275a5eb7d\"))",
]

[target.loongarch64-unknown-none]
linker = "rust-lld"
rustflags = [
    "-C",
    "link-arg=-Telm.ld",
    "-C",
    "relocation-model=pic",
    "-C",
    "code-model=small",
    "-C",
    "link-arg=-pie",
    "-C",
    "link-arg=-z",
    "-C",
    "link-arg=notext",
    "-C",
    "link-arg=--gc-sections",
    "-C",
    "link-arg=--build-id=none",
    "-A",
    "named_asm_labels",
    "--cfg=elm_kernel_api=\"contest-2026\"",
    "--check-cfg=cfg(elm_kernel_api,values(\"contest-2026\"))",
    "--cfg=elm_kernel_profile=\"1f80174a2872ea52ae596a70b9eff094e2e9f4e90b1026c49bf9b94275a5eb7d\"",
    "--check-cfg=cfg(elm_kernel_profile,values(\"1f80174a2872ea52ae596a70b9eff094e2e9f4e90b1026c49bf9b94275a5eb7d\"))",
]
