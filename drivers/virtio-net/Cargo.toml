[lints]
workspace = true

[package]
name = "net-virtio"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "net-virtio"
path = "src/main.rs"
test = false
bench = false

[lib]
name = "net_virtio"
path = "src/lib_entry.rs"
test = false
doctest = false
bench = false

[features]
default = []
elm-integrated = ["virtio/elm-integrated"]

[dependencies]
vfs = { path = "../../libs/vfs", default-features = false }
socket = { path = "../../libs/socket", default-features = false }
sched = { path = "../../libs/sched", default-features = false }
mm = { path = "../../libs/mm", default-features = false }
hal = { path = "../../hal", default-features = false }
fatfs = { path = "../../libs/fatfs", default-features = false }
extfs = { path = "../../libs/extfs", default-features = false }
errno = { path = "../../libs/errno", default-features = false }
elf = { path = "../../libs/elf", default-features = false }
efi = { path = "../../libs/efi", default-features = false }
elm = { path = "../../libs/elm", default-features = false, features = ["module", "macros"] }
allocator = { path = "../../libs/allocator", default-features = false }
general = { path = "../../general", default-features = false }
log = { path = "../../libs/log", default-features = false }
net = { path = "../../libs/net", default-features = false }
virtio = { package = "virtio-consumer", path = "../virtio/consumer-api", default-features = false }
spin = { version = "0.9", default-features = false, features = ["spin_mutex"] }
