[build]
rustflags = [
    "--cfg=elm_kernel_api=\"contest-2026\"",
    "--check-cfg=cfg(elm_kernel_api,values(\"contest-2026\"))",
    "--cfg=elm_kernel_profile=\"a851f38f5a91d05ff5a6b9f13c33dc245ee1167fd2137d76ff2d9816dccb0324\"",
    "--check-cfg=cfg(elm_kernel_profile,values(\"a851f38f5a91d05ff5a6b9f13c33dc245ee1167fd2137d76ff2d9816dccb0324\"))",
]

[target.riscv64gc-unknown-none-elf]
linker = "rust-lld"
rustflags = [
    "-C",
    "link-arg=-Telm.ld",
    "-C",
    "relocation-model=pic",
    "-C",
    "code-model=small",
    "-C",
    "link-arg=-pie",
    "-C",
    "link-arg=-z",
    "-C",
    "link-arg=notext",
    "-C",
    "link-arg=--gc-sections",
    "-C",
    "link-arg=--build-id=none",
    "--cfg=elm_kernel_api=\"contest-2026\"",
    "--check-cfg=cfg(elm_kernel_api,values(\"contest-2026\"))",
    "--cfg=elm_kernel_profile=\"a851f38f5a91d05ff5a6b9f13c33dc245ee1167fd2137d76ff2d9816dccb0324\"",
    "--check-cfg=cfg(elm_kernel_profile,values(\"a851f38f5a91d05ff5a6b9f13c33dc245ee1167fd2137d76ff2d9816dccb0324\"))",
]

[target.loongarch64-unknown-none]
linker = "rust-lld"
rustflags = [
    "-C",
    "link-arg=-Telm.ld",
    "-C",
    "relocation-model=pic",
    "-C",
    "code-model=small",
    "-C",
    "link-arg=-pie",
    "-C",
    "link-arg=-z",
    "-C",
    "link-arg=notext",
    "-C",
    "link-arg=--gc-sections",
    "-C",
    "link-arg=--build-id=none",
    "-A",
    "named_asm_labels",
    "--cfg=elm_kernel_api=\"contest-2026\"",
    "--check-cfg=cfg(elm_kernel_api,values(\"contest-2026\"))",
    "--cfg=elm_kernel_profile=\"a851f38f5a91d05ff5a6b9f13c33dc245ee1167fd2137d76ff2d9816dccb0324\"",
    "--check-cfg=cfg(elm_kernel_profile,values(\"a851f38f5a91d05ff5a6b9f13c33dc245ee1167fd2137d76ff2d9816dccb0324\"))",
]
