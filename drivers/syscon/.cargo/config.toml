[build]
rustflags = [
    "--cfg=elm_kernel_api=\"contest-2026\"",
    "--check-cfg=cfg(elm_kernel_api,values(\"contest-2026\"))",
    "--cfg=elm_kernel_profile=\"cc3a5a4d300a97a8a40b206f5ee1e0f9f314e340b1f23253e78a992243fe1cb0\"",
    "--check-cfg=cfg(elm_kernel_profile,values(\"cc3a5a4d300a97a8a40b206f5ee1e0f9f314e340b1f23253e78a992243fe1cb0\"))",
]

[target.riscv64gc-unknown-none-elf]
linker = "rust-lld"
rustflags = [
    "-C",
    "link-arg=-Telm.ld",
    "-C",
    "relocation-model=pic",
    "-C",
    "code-model=small",
    "-C",
    "link-arg=-pie",
    "-C",
    "link-arg=-z",
    "-C",
    "link-arg=notext",
    "-C",
    "link-arg=--gc-sections",
    "-C",
    "link-arg=--build-id=none",
    "--cfg=elm_kernel_api=\"contest-2026\"",
    "--check-cfg=cfg(elm_kernel_api,values(\"contest-2026\"))",
    "--cfg=elm_kernel_profile=\"cc3a5a4d300a97a8a40b206f5ee1e0f9f314e340b1f23253e78a992243fe1cb0\"",
    "--check-cfg=cfg(elm_kernel_profile,values(\"cc3a5a4d300a97a8a40b206f5ee1e0f9f314e340b1f23253e78a992243fe1cb0\"))",
]

[target.loongarch64-unknown-none]
linker = "rust-lld"
rustflags = [
    "-C",
    "link-arg=-Telm.ld",
    "-C",
    "relocation-model=pic",
    "-C",
    "code-model=small",
    "-C",
    "link-arg=-pie",
    "-C",
    "link-arg=-z",
    "-C",
    "link-arg=notext",
    "-C",
    "link-arg=--gc-sections",
    "-C",
    "link-arg=--build-id=none",
    "-A",
    "named_asm_labels",
    "--cfg=elm_kernel_api=\"contest-2026\"",
    "--check-cfg=cfg(elm_kernel_api,values(\"contest-2026\"))",
    "--cfg=elm_kernel_profile=\"cc3a5a4d300a97a8a40b206f5ee1e0f9f314e340b1f23253e78a992243fe1cb0\"",
    "--check-cfg=cfg(elm_kernel_profile,values(\"cc3a5a4d300a97a8a40b206f5ee1e0f9f314e340b1f23253e78a992243fe1cb0\"))",
]
