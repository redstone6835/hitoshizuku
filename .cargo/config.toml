[build]
#target = "riscv64gc-unknown-none-elf"
target = "loongarch64-unknown-none"

[target.riscv64gc-unknown-none-elf]
linker = "rust-lld"
rustflags = [
    "-C", "link-arg=--fatal-warnings",
    "-Z", "share-generics=no",
]

[target.loongarch64-unknown-none]
linker = "rust-lld"
rustflags = [
    "-C", "link-arg=--fatal-warnings",
    "-C", "link-arg=--no-gc-sections",
    "-A", "named_asm_labels",
    "-Z", "share-generics=no",
]

[env]
CC_loongarch64_unknown_none = "loongarch64-linux-gnu-gcc"
CC_riscv64gc_unknown_none_elf = "clang"
CFLAGS_riscv64gc_unknown_none_elf = "--target=riscv64-linux-gnu"

[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"