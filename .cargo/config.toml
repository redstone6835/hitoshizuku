[target.riscv64gc-unknown-none-elf]
linker = "rust-lld"
rustflags = [
    "-C", "link-arg=--fatal-warnings",
]

[target.loongarch64-unknown-none]
linker = "rust-lld"
rustflags = [
    "-C", "link-arg=--fatal-warnings",
    "-C", "link-arg=--no-gc-sections",
    "-A", "named_asm_labels",
]

# libs/efi contains the small freestanding C shim required by the firmware path.
# These are compiler names, not Rust toolchain overrides.
[env]
CC_loongarch64_unknown_none = "loongarch64-linux-gnu-gcc"
CC_riscv64gc_unknown_none_elf = "riscv64-linux-gnu-gcc"

# Keep the build graph invocable through Cargo without a host-tool target
# accidentally inheriting a bare-metal default.
[alias]
xtask = "run -p xtask --"
